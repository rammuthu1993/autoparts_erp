spring.config.import=optional:file:./config/application-secrets.properties
# Local development compatibility. Never activate this profile in production.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
app.security.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:5173}

# Dedicated read-only AI datasource for local development and tests.
# Set these in config/application-secrets.properties or the process environment.
app.ai.datasource.url=${AI_TOOL_DB_URL}
app.ai.datasource.username=${AI_TOOL_DB_USERNAME}
app.ai.datasource.password=${AI_TOOL_DB_PASSWORD}
