spring.application.name=autoparts-erp
spring.profiles.default=dev

# PostgreSQL connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/autoparts_erp}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JDBC
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# JWT
app.security.jwt.issuer=autoparts-erp
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-seconds=900

# Server
server.port=8080

# Application logs
logging.file.name=${LOG_FILE_PATH:logs/autoparts-erp.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB
logging.level.root=INFO

# Flyway migrations
spring.flyway.enabled=true

# Do not expose internal exception details
server.error.include-message=never
server.error.include-stacktrace=never

# Login security
app.security.login.max-failed-attempts=5
app.security.login.lock-duration-seconds=900

# Refresh token
app.security.refresh-token.expiration-seconds=604800

# Flyway migrations
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.default-schema=public
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1
# Business timezone for daily closing
app.business.time-zone=Asia/Kolkata

# Initial ADMIN account bootstrap
app.security.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.security.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.security.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

# Sarvam AI via Spring AI OpenAI-compatible client
spring.ai.openai.api-key=${SARVAM_API_KEY}
spring.ai.openai.base-url=https://api.sarvam.ai/v1
spring.ai.openai.chat.options.model=${SARVAM_MODEL:sarvam-105b}

# Shared default for calls without request-specific OpenAiChatOptions.
spring.ai.openai.chat.max-tokens=${AI_NORMAL_MAX_OUTPUT_TOKENS:1024}
spring.ai.openai.chat.reasoning-effort=${AI_REASONING_EFFORT:low}

spring.ai.openai.timeout=45s
# Retry policy is implemented once in AiResilienceService; avoid nested client retries.
spring.ai.openai.max-retries=0

# ========================================
# AI CONFIGURATION
# ========================================

# AI application settings
app.ai.enabled=true
app.ai.generation.max-output-tokens=${AI_MAX_OUTPUT_TOKENS:1024}
app.ai.generation.normal.max-output-tokens=${AI_NORMAL_MAX_OUTPUT_TOKENS:1024}
app.ai.generation.reasoning-effort=${AI_REASONING_EFFORT:low}
app.ai.generation.recovery.max-output-tokens=${AI_RECOVERY_MAX_OUTPUT_TOKENS:1536}
app.ai.generation.recovery.max-attempts=${AI_RECOVERY_MAX_ATTEMPTS:2}
app.ai.evaluation.max-output-tokens=${AI_EVALUATION_MAX_OUTPUT_TOKENS:1024}


# ==========================================
# AI Agent Execution Timeout
# ==========================================

ai.agent.execution-timeout=60s




# Stage 3C Phase 5: opt-in live-provider grounded-answer evaluation.
# Keep disabled by default. Enable only for an intentional administrator-triggered run.
app.ai.live-evaluation.enabled=${AI_LIVE_EVALUATION_ENABLED:false}
app.ai.live-evaluation.provider=SARVAM
# Optional provider pricing. Leave unset unless the current contract price is known.
app.ai.live-evaluation.input-cost-per-million=${AI_INPUT_COST_PER_MILLION:}
app.ai.live-evaluation.output-cost-per-million=${AI_OUTPUT_COST_PER_MILLION:}
app.ai.live-evaluation.cost-currency=${AI_COST_CURRENCY:UNCONFIGURED}


# Stage 3C Phase 5 synthetic evaluation corpus. Keep disabled by default.
# Enable only against a local development database when explicitly seeding fixtures.
app.ai.live-evaluation.corpus.enabled=${AI_LIVE_EVALUATION_CORPUS_ENABLED:false}
app.ai.live-evaluation.corpus.path=${AI_LIVE_EVALUATION_CORPUS_PATH:src/test/resources/knowledge}
#app.security.admin-token=${ADMIN_TOKEN}


# AI lookup query safeguards
app.ai.datasource.query-timeout-seconds=${AI_TOOL_QUERY_TIMEOUT_SECONDS:15}
app.ai.datasource.max-rows=${AI_TOOL_MAX_ROWS:500}

# Actuator: health only is public; other endpoints remain protected by Spring Security.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.info.env.enabled=false


# ========================================
# STAGE 4: AI RELIABILITY AND OBSERVABILITY
# ========================================
# Custom retry layer owns provider retries; keep Spring AI internal retries disabled.
app.ai.resilience.max-retries=${AI_PROVIDER_MAX_RETRIES:3}
app.ai.resilience.base-delay=${AI_PROVIDER_RETRY_BASE_DELAY:1s}
app.ai.resilience.max-delay=${AI_PROVIDER_RETRY_MAX_DELAY:4s}
app.ai.resilience.jitter=${AI_PROVIDER_RETRY_JITTER:0.25}

# Per authenticated user, rolling 60-second window; local-instance global execution cap.
app.ai.rate-limit.requests-per-minute=${AI_REQUESTS_PER_MINUTE:20}
app.ai.rate-limit.window-seconds=${AI_RATE_LIMIT_WINDOW_SECONDS:60}
app.ai.rate-limit.max-concurrent-executions=${AI_MAX_CONCURRENT_EXECUTIONS:10}
app.ai.rate-limit.max-tracked-users=${AI_RATE_LIMIT_MAX_TRACKED_USERS:10000}

# Approximate history budget (4 UTF-8 bytes/token); current request is included.
app.ai.history.max-tokens=${AI_HISTORY_MAX_TOKENS:2000}
# Dev default remains best-effort; production overrides this to true.
app.ai.audit.fail-closed=${AI_AUDIT_FAIL_CLOSED:false}
