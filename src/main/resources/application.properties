spring.config.import=optional:file:./config/application-secrets.properties
spring.application.name=autoparts-erp

# PostgreSQL connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/autoparts_erp}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JDBC
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# JWT
app.security.jwt.issuer=autoparts-erp
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-seconds=900

# Server
server.port=8080

# Application logs
logging.file.name=${LOG_FILE_PATH:logs/autoparts-erp.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB
logging.level.root=INFO

# Flyway migrations
spring.flyway.enabled=true

# Do not expose internal exception details
server.error.include-message=never
server.error.include-stacktrace=never

# Login security
app.security.login.max-failed-attempts=5
app.security.login.lock-duration-seconds=900

# Refresh token
app.security.refresh-token.expiration-seconds=604800

# Flyway migrations
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.default-schema=public
# Development transition only:
# Existing manually-created auth tables must be baselined at version 1.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# Business timezone for daily closing
app.business.time-zone=Asia/Kolkata

# Initial ADMIN account bootstrap
app.security.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.security.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.security.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

# Sarvam AI via Spring AI OpenAI-compatible client
spring.ai.openai.api-key=${SARVAM_API_KEY}
spring.ai.openai.base-url=https://api.sarvam.ai/v1
spring.ai.openai.chat.model=sarvam-105b

# Actual Spring AI chat completion limit
spring.ai.openai.chat.max-tokens=${AI_MAX_TOKENS:4096}

spring.ai.openai.timeout=45s
spring.ai.openai.max-retries=0

# ========================================
# AI CONFIGURATION
# ========================================

# AI application settings
app.ai.enabled=true


# ==========================================
# AI Agent Execution Timeout
# ==========================================

ai.agent.execution-timeout=60s




# Stage 3C Phase 5: opt-in live-provider grounded-answer evaluation.
# Keep disabled by default. Enable only for an intentional administrator-triggered run.
app.ai.live-evaluation.enabled=true
app.ai.live-evaluation.provider=SARVAM
# Optional provider pricing. Leave unset unless the current contract price is known.
app.ai.live-evaluation.input-cost-per-million=${AI_INPUT_COST_PER_MILLION:}
app.ai.live-evaluation.output-cost-per-million=${AI_OUTPUT_COST_PER_MILLION:}
app.ai.live-evaluation.cost-currency=${AI_COST_CURRENCY:UNCONFIGURED}


# Stage 3C Phase 5 synthetic evaluation corpus. Keep disabled by default.
# Enable only against a local development database when explicitly seeding fixtures.
app.ai.live-evaluation.corpus.enabled=${AI_LIVE_EVALUATION_CORPUS_ENABLED:false}
app.ai.live-evaluation.corpus.path=${AI_LIVE_EVALUATION_CORPUS_PATH:src/test/resources/knowledge}
#app.security.admin-token=${ADMIN_TOKEN}
spring.ai.openai.chat.extra-body.reasoning_effort=low

