spring.config.import=optional:file:./config/application-secrets.properties
spring.application.name=autoparts-erp

# PostgreSQL connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/autoparts_erp}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JDBC
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# JWT
app.security.jwt.issuer=autoparts-erp
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-seconds=900

# Server
server.port=8080

# Application logs
logging.file.name=${LOG_FILE_PATH:logs/autoparts-erp.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB
logging.level.root=INFO

# Flyway migrations
spring.flyway.enabled=true

# Do not expose internal exception details
server.error.include-message=never
server.error.include-stacktrace=never


# Flyway migrations
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.default-schema=public
# Development transition only:
# Existing manually-created auth tables must be baselined at version 1.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1


