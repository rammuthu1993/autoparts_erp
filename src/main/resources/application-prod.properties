# Production profile: all credentials and deployment-specific values are mandatory.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
app.security.jwt.secret=${JWT_SECRET}
spring.ai.openai.api-key=${SARVAM_API_KEY}

# Production must not baseline an unknown schema automatically.
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# AI tools must use a distinct PostgreSQL login granted SELECT-only privileges.
app.ai.datasource.url=${AI_TOOL_DB_URL}
app.ai.datasource.username=${AI_TOOL_DB_USERNAME}
app.ai.datasource.password=${AI_TOOL_DB_PASSWORD}

# Explicit browser origins; comma-separated exact origins, no wildcard.
app.security.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# Conservative production pool defaults; tune against the PostgreSQL connection budget.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:10000}
spring.datasource.hikari.validation-timeout=${DB_POOL_VALIDATION_TIMEOUT_MS:3000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1500000}
spring.datasource.hikari.leak-detection-threshold=${DB_POOL_LEAK_DETECTION_MS:0}

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never


# Stage 4: conservative AI provider protection. Values may be overridden by deployment environment.
app.ai.resilience.max-retries=${AI_PROVIDER_MAX_RETRIES:3}
app.ai.resilience.base-delay=${AI_PROVIDER_RETRY_BASE_DELAY:1s}
app.ai.resilience.max-delay=${AI_PROVIDER_RETRY_MAX_DELAY:4s}
app.ai.resilience.jitter=${AI_PROVIDER_RETRY_JITTER:0.25}
app.ai.rate-limit.requests-per-minute=${AI_REQUESTS_PER_MINUTE:20}
app.ai.rate-limit.window-seconds=${AI_RATE_LIMIT_WINDOW_SECONDS:60}
app.ai.rate-limit.max-concurrent-executions=${AI_MAX_CONCURRENT_EXECUTIONS:10}
app.ai.rate-limit.max-tracked-users=${AI_RATE_LIMIT_MAX_TRACKED_USERS:10000}
app.ai.history.max-tokens=${AI_HISTORY_MAX_TOKENS:2000}

# A tool result is not returned successfully unless its audit row is persisted.
app.ai.audit.fail-closed=${AI_AUDIT_FAIL_CLOSED:true}

# Use a dedicated schema-owner login for Flyway; never reuse the ERP runtime role.
spring.flyway.user=${FLYWAY_DB_USERNAME}
spring.flyway.password=${FLYWAY_DB_PASSWORD}
